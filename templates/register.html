{% extends "base.html" %}
{% block title %}ثبت‌نام | کلود کیوب{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <a href="{{ url_for('landing') }}" class="xm-logo-badge mb-3" style="width: 54px; height: 54px; font-size: 1.4rem;">
                <i class="fas fa-user-plus"></i>
            </a>
            <h1 class="fw-extrabold mb-1" style="font-size: 1.35rem;">ایجاد حساب کاربری</h1>
            <span class="small text-muted">Cloud Cube Console</span>
        </div>

        {% if error_msg %}
        <div class="alert alert-danger d-flex align-items-center gap-2">
            <i class="fas fa-circle-exclamation"></i>
            <span>{{ error_msg }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}" class="d-flex flex-column gap-3">
            <div>
                <label class="form-label">نام کاربری (انگلیسی)</label>
                <input type="text" name="username" class="form-control font-mono" placeholder="username" required autofocus>
            </div>
            <div>
                <label class="form-label">رمز عبور</label>
                <input type="password" name="password" class="form-control font-mono" placeholder="حداقل ۴ کاراکتر" required>
            </div>
            <div>
                <label class="form-label">چت آیدی عددی تلگرام (اختیاری)</label>
                <input type="text" name="telegram_chat_id" class="form-control font-mono" placeholder="123456789">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-1 rounded-pill">
                <i class="fas fa-check"></i>
                <span>ثبت‌نام و ورود</span>
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small">
            <div class="mb-2">
                حساب دارید؟ <a href="{{ url_for('login') }}" class="fw-bold">ورود به پنل</a>
            </div>
            <a href="{{ url_for('landing') }}" class="text-muted"><i class="fas fa-arrow-right me-1"></i> صفحه اصلی سایت</a>
        </div>
    </div>
</div>
{% endblock %}
