{% extends "base.html" %}
{% block title %}افزودن سرور دستی | XMonitor{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 fw-bold mb-1 d-flex align-items-center gap-2">
                    <i class="fas fa-server text-primary"></i>
                    افزودن دستی سرور جدید
                </h2>
                <p class="text-muted small mb-0">برای ثبت سرورهای غیر ESXi یا سرورهای از پیش آماده‌شده</p>
            </div>
            <a href="{{ url_for('manage_servers') }}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                <i class="fas fa-arrow-right me-1"></i> بازگشت
            </a>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('add_server_page') }}" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">نام سرور</label>
                        <input type="text" name="name" placeholder="مثلاً: Ubuntu-01" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">آدرس IP</label>
                        <input type="text" name="ip" placeholder="185.42.212.241" class="form-control font-mono" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">نام کاربری SSH</label>
                        <input type="text" name="username" value="root" class="form-control font-mono" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">رمز عبور SSH</label>
                        <input type="password" name="password" placeholder="••••••••" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">سقف ترافیک ماهیانه (GiB)</label>
                        <input type="number" step="0.1" name="traffic_limit" value="0" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">چت آیدی تلگرام (اختیاری)</label>
                        <input type="text" name="telegram_chat_id" placeholder="123456789" class="form-control font-mono">
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-primary rounded-pill px-4">
                            <i class="fas fa-plus me-1"></i> افزودن سرور
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
