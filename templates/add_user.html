{% extends "base.html" %}
{% block title %}افزودن کاربر جدید | XMonitor{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 fw-bold mb-1 d-flex align-items-center gap-2">
                    <i class="fas fa-user-plus text-primary"></i>
                    افزودن کاربر جدید
                </h2>
                <p class="text-muted small mb-0">ایجاد حساب کاربری برای مشتریان یا مدیران پنل</p>
            </div>
            <a href="{{ url_for('manage_users') }}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                <i class="fas fa-arrow-right me-1"></i> بازگشت
            </a>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('add_user_page') }}" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">نام کاربری</label>
                        <input type="text" name="username" placeholder="مثلاً: client_01" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">رمز عبور</label>
                        <input type="password" name="password" placeholder="••••••••" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">نقش کاربری</label>
                        <select name="role" class="form-select">
                            <option value="user">کاربر عادی (User)</option>
                            <option value="admin">مدیر (Admin)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">چت آیدی تلگرام (اختیاری)</label>
                        <input type="text" name="telegram_chat_id" placeholder="123456789" class="form-control font-mono">
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-primary rounded-pill px-4">
                            <i class="fas fa-plus me-1"></i> ایجاد کاربر
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
