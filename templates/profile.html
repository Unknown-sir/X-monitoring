{% extends "base.html" %}
{% block title %}پروفایل کاربری | XMonitor{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 fw-bold mb-1 d-flex align-items-center gap-2">
                    <i class="fas fa-id-badge text-primary"></i>
                    تنظیمات پروفایل
                </h2>
                <p class="text-muted small mb-0">به‌روزرسانی چت آیدی تلگرام و رمز عبور حساب</p>
            </div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                <i class="fas fa-arrow-right me-1"></i> داشبورد
            </a>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" class="d-flex flex-column gap-3">
                    <div>
                        <label class="form-label">چت آیدی تلگرام (Telegram Chat ID)</label>
                        <input type="text" name="telegram_chat_id" value="{{ telegram_chat_id or '' }}" class="form-control font-mono" placeholder="مثلاً: 123456789">
                    </div>
                    <div>
                        <label class="form-label">رمز عبور جدید (اختیاری)</label>
                        <input type="password" name="password" placeholder="در صورت عدم نیاز به تغییر، خالی بگذارید" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary rounded-pill py-2 mt-2">
                        <i class="fas fa-save me-1"></i> ذخیره تغییرات
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
