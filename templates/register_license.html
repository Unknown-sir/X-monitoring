{% extends "base.html" %}
{% block title %}ثبت لایسنس | XMonitor{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 fw-bold mb-1 d-flex align-items-center gap-2">
                    <i class="fas fa-key text-primary"></i>
                    ثبت و فعال‌سازی لایسنس
                </h2>
                <p class="text-muted small mb-0">کلید لایسنس ۱۶ رقمی دریافتی را برای تمدید پنل وارد کنید</p>
            </div>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                <i class="fas fa-arrow-right me-1"></i> پنل مدیریت
            </a>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" class="d-flex flex-column gap-3">
                    <div>
                        <label class="form-label">کلید لایسنس</label>
                        <input type="text" name="license_key" class="form-control font-mono text-center" placeholder="XXXX-XXXX-XXXX-XXXX" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 rounded-pill py-2">
                        <i class="fas fa-check-circle me-1"></i> ثبت و فعال‌سازی
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
