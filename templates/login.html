{% extends "base.html" %}
{% block title %}ورود به پنل | XMonitor{% endblock %}
{% block auth_content %}
<div class="xm-auth-page">
    <div class="xm-auth-card">
        <div class="text-center mb-4">
            <div class="xm-logo-badge mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.45rem; border-radius: 15px;">
                <i class="fas fa-bolt"></i>
            </div>
            <h1 class="h4 fw-bold mb-1">ورود به پنل XMonitor</h1>
            <p class="text-muted small mb-0">سامانه مانیتورینگ ترافیک و اتوماسیون ESXi</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="d-flex flex-column gap-3">
            <div>
                <label for="username" class="form-label">نام کاربری</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="نام کاربری خود را وارد کنید" required autofocus>
            </div>

            <div>
                <label for="password" class="form-label">رمز عبور</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePass()" style="border-color: var(--border-color) !important;">
                        <i class="fas fa-eye" id="passEye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 mt-2 fw-bold">
                <i class="fas fa-sign-in-alt me-2"></i>
                ورود به سیستم
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-color) !important;">
            <small class="text-muted">XMonitor Cloud & ESXi Automation • v3.0</small>
        </div>
    </div>
</div>

<script>
function togglePass() {
    const inp = document.getElementById('password');
    const eye = document.getElementById('passEye');
    if (inp.type === 'password') {
        inp.type = 'text';
        eye.className = 'fas fa-eye-slash';
    } else {
        inp.type = 'password';
        eye.className = 'fas fa-eye';
    }
}
</script>
{% endblock %}
