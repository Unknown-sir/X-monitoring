{% extends "base.html" %}
{% block title %}ورود به پنل | XMonitor{% endblock %}
{% block auth_content %}
<div class="login-shell">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-logo-box mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.4rem; border-radius: 14px;">
                <i class="fas fa-bolt"></i>
            </div>
            <h1 class="h4 fw-bold mb-1">خوش آمدید</h1>
            <p class="text-muted small mb-0">برای مدیریت سرورها و زیرساخت ESXi وارد شوید</p>
        </div>

        <form method="POST" class="d-flex flex-column gap-3">
            <div>
                <label for="username" class="form-label">نام کاربری</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary-subtle text-muted" style="border-color: var(--border-subtle) !important;">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="مثلاً admin" required autofocus>
                </div>
            </div>

            <div>
                <label for="password" class="form-label">رمز عبور</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary-subtle text-muted" style="border-color: var(--border-subtle) !important;">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePass()" style="border-color: var(--border-subtle) !important;">
                        <i class="fas fa-eye" id="passEye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 mt-2 fw-semibold">
                <i class="fas fa-sign-in-alt me-2"></i>
                ورود به داشبورد
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-subtle) !important;">
            <small class="text-muted">XMonitor Cloud & ESXi Panel</small>
        </div>
    </div>
</div>

<script>
function togglePass() {
    const inp = document.getElementById('password');
    const eye = document.getElementById('passEye');
    if (inp.type === 'password') {
        inp.type = 'text';
        eye.className = 'fas fa-eye-slash';
    } else {
        inp.type = 'password';
        eye.className = 'fas fa-eye';
    }
}
</script>
{% endblock %}
